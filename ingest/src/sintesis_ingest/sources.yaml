# Catálogo de fuentes: QUÉ se descarga. Igual en todos los entornos.
# Dónde se guarda y con qué credenciales va por variables de entorno (config.py, .env.example).
# Cada `connector` acepta solo sus propios campos; uno mal escrito hace fallar la carga.
# Fichas de cada fuente: docs/fuentes.md.

sources:
  # --- INE regional: boletín más reciente cuyo título contiene `keyword` (región 5 = Valparaíso) ---
  - id: empleo_regional
    name: Empleo Regional
    connector: ine_regional
    region: 5
    keyword: empleo

  - id: energia_regional
    name: Energía Regional
    connector: ine_regional
    region: 5
    keyword: energía eléctrica

  - id: exportaciones_regional
    name: Exportaciones Regional
    connector: ine_regional
    region: 5
    keyword: exportaciones
    file_names:
      xlsx: exportaciones_series_mensuales.xlsx

  - id: ipman_regional
    name: Manufactura Regional (IPMAN)
    connector: ine_regional
    region: 5
    keyword: manufacturera

  - id: isup_regional
    name: Supermercados Regional (ISUP)
    connector: ine_regional
    region: 5
    keyword: supermercados

  # --- Senado: consulta avanzada, una fuente por estado del proyecto ---
  - id: senado_proyectos_tramitacion
    name: Proyectos de ley en tramitación (Senado)
    connector: senado
    status: T
    date_field: ingreso

  - id: senado_leyes_publicadas
    name: Leyes publicadas (Senado)
    connector: senado
    status: L
    date_field: publicacion

  # --- Banco Central, API BDE: historia completa en cada corrida; un raw por serie (docs/fuentes.md) ---
  - id: bcentral_uf
    name: Unidad de Fomento (UF)
    connector: bcentral_api
    first_date: 2000-01-01
    series:
      uf: F073.UFF.PRE.Z.D

  - id: bcentral_imacec
    name: IMACEC (índices base 2018)
    connector: bcentral_api
    first_date: 1996-01-01
    series:
      imacec_total: F032.IMC.IND.Z.Z.EP18.Z.Z.0.M
      imacec_no_minero: F032.IMC.IND.Z.Z.EP18.N03.Z.0.M
      imacec_mineria: F032.IMC.IND.Z.Z.EP18.03.Z.0.M
      imacec_industria: F032.IMC.IND.Z.Z.EP18.04.Z.0.M
      imacec_resto_bienes: F032.IMC.IND.Z.Z.EP18.RB.Z.0.M
      imacec_comercio: F032.IMC.IND.Z.Z.EP18.COM.Z.0.M
      imacec_servicios: F032.IMC.IND.Z.Z.EP18.SERV.Z.0.M
      imacec_produccion_bienes: F032.IMC.IND.Z.Z.EP18.PB.Z.0.M
      imacec_impuestos: F032.IMC.IND.Z.Z.EP18.IMP.Z.0.M
      imacec_total_desest: F032.IMC.IND.Z.Z.EP18.Z.Z.1.M
