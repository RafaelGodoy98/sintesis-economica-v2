[project]
name = "sintesis-ingest"
version = "0.1.0"
description = "Ingesta de indicadores económicos hacia la capa raw (GCS) y BigQuery."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
