# Única fuente de verdad del lint (docs/plan.md §7.2): lo mismo corre en local y en CI.
# sqlfluff y terraform fmt se agregan cuando exista SQL o Terraform.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: uv.lock

  # Barrera por nombre, sin mirar el contenido: cubre `git add -f .env` y lo que detect-secrets no reconozca.
  - repo: local
    hooks:
      - id: no-env-files
        name: Bloquear archivos .env
        entry: "Los archivos .env no se commitean (usa .env.example)"
        language: fail
        files: '(^|/)\.env(\..+)?$'
        exclude: '(^|/)\.env\.example$'
